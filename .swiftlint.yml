included:
  - GalleryApp
  - GalleryAppTests

excluded:
  - .build
  - DerivedData
  - GalleryApp.xcodeproj

line_length:
  warning: 120
  error: 140

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id

opt_in_rules:
  - closure_end_indentation
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - file_name_no_space
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
