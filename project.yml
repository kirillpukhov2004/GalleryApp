name: GalleryApp

options:
  bundleIdPrefix: com.kirillpukhov
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configFiles:
  Debug: GalleryApp/Resources/Config.xcconfig
  Release: GalleryApp/Resources/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  GalleryApp:
    type: application
    platform: iOS
    sources:
      - path: GalleryApp
        excludes:
          - App/Info.plist
          - Resources/Config.xcconfig
          - Resources/Config.xcconfig.example
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirillpukhov.GalleryApp
        INFOPLIST_FILE: GalleryApp/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  GalleryAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GalleryAppTests
    dependencies:
      - target: GalleryApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirillpukhov.GalleryAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GalleryApp.app/GalleryApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GalleryApp:
    build:
      targets:
        GalleryApp: all
        GalleryAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GalleryAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
